[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinformatics-agent-skills"
version = "1.0.0"
description = "The open-source library of scientific AI Agent Skills for Bioinformatics, Multi-Omics, and Drug Discovery."
readme = "README.md"
authors = [
    { name = "Yulia Nuzhnenko", email = "yuliannanuzhnenko@gmail.com" }
]
license = { text = "MIT" }
keywords = ["bioinformatics", "agent-skills", "claude-code", "cursor", "ai-scientist", "genomics", "multi-omics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0"
]

[project.urls]
Homepage = "https://github.com/YuliaNuzhnenko/bioinformatics-agent-skills"
Documentation = "https://github.com/YuliaNuzhnenko/bioinformatics-agent-skills/tree/main/docs"
Repository = "https://github.com/YuliaNuzhnenko/bioinformatics-agent-skills"

[project.scripts]
scan-skills = "scan_skills:main"
